[project]
name = "toolgate"
version = "0.1.0"
description = "Capability gating for MCP agents, and the measurements that argue for it"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Hashir Ahmed" }]

# Pins are exact and deliberate. See docs/PINNING.md for the reasoning behind
# scikit-learn and transformers in particular -- both must match the versions
# that serialised the reused LLMShield V0/V3 artifacts.
#
# The base install is what the proxy path imports and nothing more: the MCP SDK
# (and its own dependencies), pydantic, pyyaml, anyio and platformdirs. The
# scientific stack, the model runtimes and the Anthropic SDK are only needed to
# reproduce the research (detectors, corpus, gauge, reference agent) and live in
# the `research` extra below. tests/test_slim_imports.py holds that line.
dependencies = [
    "mcp==2.1.1",
    "pydantic==2.12.5",
    "pyyaml==6.0.3",
    # Already a dependency of mcp; pinned directly because the proxy uses it
    # directly rather than only through the SDK.
    "anyio==4.15.0",
    # The proxy's default state directory (pins, decision log).
    "platformdirs==4.12.2",
]

[project.scripts]
toolgate = "toolgate.cli:main"

[project.optional-dependencies]
# Everything needed to reproduce the measurements: `uv sync --extra research`.
# The exact pins are unchanged from when these were base dependencies, so the
# recorded digests and published figures were produced under exactly these
# versions (docs/PINNING.md).
research = [
    "anthropic==0.86.0",
    # Only settings.py (the reference agent's API key) uses it; the proxy reads
    # its configuration from YAML and argv, and mcp does not depend on it.
    "pydantic-settings==2.13.1",
    "numpy==2.4.3",
    "scipy==1.17.1",
    "scikit-learn==1.9.0",
    "joblib==1.5.2",
    "torch==2.14.0",
    # tokenizers/safetensors are transformers' own sub-dependencies and are
    # pinned transitively by uv.lock rather than guessed at here.
    "transformers==5.12.1",
    "sentencepiece==0.2.2",
    "datasketch==2.0.0",
    "statsmodels==0.15.0",
]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.3.0",
    "ruff==0.14.4",
    "mypy==1.18.2",
    "types-PyYAML==6.0.12.20250915",
]

# Constraint A3 is CPU-only inference. On Linux, PyPI's `torch` wheel is the
# CUDA build (multi-gigabyte); the CPU wheel lives on PyTorch's own index. This
# matches the dependency to the stated constraint rather than working around
# slow CI. Windows and macOS PyPI wheels are already CPU-only, so the marker
# keeps their resolution untouched.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
markers = [
    "models: requires the reused LLMShield V0/V3 artifacts on disk (slow, skipped in CI)",
    "live_servers: starts the pinned reference MCP servers via npx/uvx (skipped if absent; runs in CI)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["toolgate"]
mypy_path = "src"
strict = true
warn_unreachable = true
untyped_calls_exclude = ["transformers", "joblib", "sklearn"]

# Third-party scientific packages ship no type information. Silencing them
# here keeps `strict` meaningful for our own code rather than disabling it.
[[tool.mypy.overrides]]
module = [
    "joblib.*",
    "sklearn.*",
    "transformers.*",
    "torch.*",
    "yaml.*",
    "datasketch.*",
    "statsmodels.*",
]
ignore_missing_imports = true
disallow_untyped_calls = false
