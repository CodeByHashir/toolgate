# Fusion and policy configuration (FR-4, FR-5, FR-6, FR-7, FR-9).
#
# THIS IS THE DEFAULT PROFILE: rules + PII only. Two companions differ from it
# only in their `detectors.inert` list:
#
#   config/policy.guard.yaml     + guard          (fetchable; anyone can run it)
#   config/policy.research.yaml  + v0, v3, guard  (needs the private weights)
#
# Select one with `toolgate run-agent --policy <path>`. A test asserts the
# three files differ in nothing else, so the choice cannot change a decision.
#
# Why the split exists, and why it is not a decision change. `inert` detectors
# are scored and logged but carry zero decision weight, so moving v0/v3 between
# these two files cannot change any Allow/Redact/Block/Escalate outcome --
# `PolicyEngine.decide()` never reads a key that is only in `inert`. What it
# changes is cost, and the cost is not small:
#
#   * `build_detectors` constructs every key any role names, so listing v0/v3
#     as inert still imports torch + transformers and runs DeBERTa-v3-base on
#     every single tool result.
#   * docs/REPORT.md section 6 measures V3 at 172.52 ms mean, and up to 13.1 s
#     for one real web page on the M9 chain -- where for 9 of 16 fetches the
#     gate took longer than the network round-trip that produced the content.
#   * The light path (rules_mcp + rules_inj + pii) measures 0.02-0.03 ms each,
#     0.08 ms in total.
#
# So the old default paid seconds per call, and a multi-gigabyte dependency
# tree, to log two scores that no decision reads. Shipping that as the default
# made the safe configuration the expensive one, which is how safe defaults
# stop being used. The research profile keeps every one of those scores
# reachable for anyone reproducing docs/REPORT.md -- nothing was deleted, and
# `gauge-run` scores v0/v3 unconditionally regardless of this file
# (`gauge/run.py:build_detectors` is a different function).
#
# `rules_inj` stays inert HERE, in the default, on purpose: it is a regex sweep
# costing ~0.03 ms, and logging its score every run is what keeps its 0/187
# transfer result visible rather than filed away in a document.
#
# Every setting here traces to a measurement in docs/POLICY-AUDIT.md and a
# decision recorded in plan.md 2.15 -- nothing is a default carried over from
# LLMShield's policies/default.json (plan.md 2.12 explains why that file is
# not safe to adopt on this surface).
#
#   * Max/OR fusion, never weighted-linear averaging. Detectors are
#     near-orthogonal (pairwise Jaccard 0.00-0.09) and none exceeds 20.3%
#     recall; averaging weak orthogonal signals at ~0.3 weight cannot cross
#     any useful threshold -- the FM-5 failure the inherited dissertation
#     blames for 75.7% of bypasses. There is therefore no "weights" block
#     below: each detector's own threshold decides whether IT fires, and any
#     firing detector in a role is enough (OR).
#   * PII carries zero injection-decision weight (see `detectors.redaction`
#     below). Its apparent 19.3% recall on the pre-M3b audit was an
#     InjecAgent benchmark artefact (34/35 hits were the fixed literal
#     amy.watson@gmail.com). Its job is SEC-3/NFR-4 style redaction, not
#     detecting injection.
#   * INJ-* stays enabled but scored-but-inert (see `detectors.inert`). It
#     catches 0 of 187 real indirect-injection payloads and produces every
#     rule false positive (docs/POLICY-AUDIT.md section 2). Logging its score
#     every run keeps that 0.0% transfer finding visible without letting it
#     degrade a live decision.
#   * V0 and V3 (M5) are inert for the identical reason, and as of the profile
#     split above they are named only in `config/policy.research.yaml` --
#     inert either way, so no decision differs. Their thresholds in
#     docs/POLICY-AUDIT.md section 3 are ad-hoc percentile splits on ~800
#     benign lines -- the document's own words are "directional, not a
#     result". V0 alone scores README.md-style benign content at 0.986
#     not_benign (section 4.1); promoting either to `injection` on today's
#     numbers would repeat the exact ML-circuit-breaker mistake this file
#     exists to avoid, just relabelled from Block to Escalate-spam. They run
#     against every intercepted tool result and their real scores reach the
#     audit log regardless (FR-2, FR-3) -- promotion to `injection` is a
#     one-line, no-code-change ablation once M7 actually calibrates them.
#   * Escalate is the default action on detection, not Block. With 74.3% of
#     payloads caught by nothing at all, a Block-by-default policy would pay
#     the full false-positive cost while still missing three quarters of
#     attacks.
#
# `calibrated: false` is load-bearing, not a placeholder. FR-11 requires
# matched-FPR calibration on THIS surface before Block is safe to use; until
# this flips to true, PolicyEngine.decide() (src/llmshield_mcp/gating/policy.py)
# refuses to ever return Decision.BLOCK, downgrading it to Decision.ESCALATE
# instead. Flip it only after an M7 calibration run has actually produced
# thresholds for this file -- not by hand, and not to unblock a test.
calibrated: false

# SEC-6: a detector that raised has "no opinion", not a benign vote. This is
# the decision that opinion becomes instead. Must be "escalate" or "block"
# (never "allow" -- that would make a crashed detector indistinguishable from
# a clean scan) and is itself subject to the `calibrated` gate above.
on_detector_failure: escalate

# Which logical detector KEYS (assigned by the gate -- see
# gating/transport.py:build_detectors -- not the same as DetectorResult.detector)
# participate in which role. `injection` and `redaction` feed the decision;
# `inert` is scored and logged only. A key only gets constructed (and only
# then pays its load cost -- real for v0/v3) if it appears in one of these
# three lists. rules_mcp/rules_inj are the same RuleDetector class
# constructed twice with different `families`, so this is the only place
# their roles differ.
detectors:
  injection:
    - rules_mcp
  redaction:
    - pii
  inert:
    - rules_inj
    # v0 and v3 live in config/policy.research.yaml -- see the profile note at
    # the top of this file. Adding them back here is a supported, decision-
    # neutral change; it costs ~175 ms per tool result and the torch install.

# Per-detector, per-action score thresholds, in [0, 1]. Rules today are
# binary (0.0 or 1.0), so 1.0 means "the family fired at all". No entries
# for v0/v3 here: PolicyEngine.decide() never reads a threshold for a key
# that isn't in `injection` or `redaction`, so one would be dead
# configuration while they stay inert. To ablate one in, add it under
# `detectors.injection` above AND a threshold here -- e.g. (NOT calibrated,
# see docs/POLICY-AUDIT.md section 3 for where these ad-hoc numbers came
# from): `v0: {escalate: 0.94}` reaches roughly the 5.3%-recall-at-1%-FPR
# operating point measured there.
thresholds:
  rules_mcp:
    escalate: 1.0
    # Additionally requires calibrated: true AND detail.normalisation_only
    # (detectors/normalise.py) -- a detection normalisation exposed but that
    # cannot be redacted precisely against the original text. See policy.py.
    # Severity-aware refinement of this rule is deferred to M7 calibration
    # (docs/POLICY-AUDIT.md recommendation 4), not assumed here.
    block: 1.0
  pii:
    # Matches detectors/pii.py DEFAULT_CONFIDENCE_THRESHOLD. Any entity at or
    # above this confidence gets its span masked, independently of whatever
    # the injection signal decides.
    redact: 0.7

# Indicative per-action false-positive budgets from plan.md 2.15. Not
# enforced numerically anywhere yet -- there is no calibration data until M7.
# Recorded here so the target survives the gap between design and calibration.
fpr_budget:
  block: 0.001
  redact: 0.01
  escalate: 0.05

gate:
  # FR-16 / SEC-2. Moved here from the --max-result-chars CLI flag (M2) now
  # that a policy file exists to hold it, per FR-9. The flag still overrides
  # this when passed explicitly (see cli.py / gating/transport.py Gate.__init__).
  max_result_chars: 200000

# ---------------------------------------------------------------------------
# tool_calls: capability gating of OUTBOUND tools/call requests
# ---------------------------------------------------------------------------
#
# Absent here on purpose -- this default profile ships with capability gating
# OFF, so adding the layer changed nothing for anyone who has not opted in.
# `config/policy.agent.yaml` is a working example; the block looks like this:
#
#   tool_calls:
#     default: allow          # `block` turns the rules into an allowlist
#     rules:
#       filesystem.read_text_file:
#         paths: ["sandbox/**"]        # sandbox escape -> blocked
#       fetch.fetch:
#         egress: ["docs.example.com"] # exfiltration -> blocked
#       github.delete_repo:
#         action: block                # destructive -> never runs
#
# **Why this layer exists, and why it is different from everything above.**
# Every detector in this file inspects content and asks "does this look like an
# attack?". docs/REPORT.md measures how well that works here: ~20% recall at
# best, and a purpose-built production classifier indistinguishable from
# chance. This block asks "is the agent allowed to do this?" instead, which
# needs no classifier -- you do not have to recognise the injection that talked
# an agent into reading ~/.ssh/id_rsa to notice it is reading outside its
# sandbox.
#
# Against the behaviour a rule names there is no false-negative rate, because
# nothing is being classified. That is a real guarantee. It is NOT a guarantee
# that the agent is safe: it bounds the blast radius of a successful injection
# to whatever the policy still permits.
#
# Note that `calibrated: false` above does NOT gate these blocks. That ceiling
# exists because detector thresholds are uncalibrated on this surface; a
# capability rule has no threshold and no false-positive rate to calibrate.
# See gating/tool_calls.py.

# ---------------------------------------------------------------------------
# tool_declarations: integrity gating of INBOUND tool declarations
# ---------------------------------------------------------------------------
#
# Absent here on purpose -- the default profile ships with declaration gating
# OFF, so adding the layer changed nothing for anyone who has not opted in.
# With no block, no gate is built: nothing is pinned, nothing is logged.
#
# The third attacker-controlled channel at the MCP boundary. Tool results are
# inspected by detectors (~20% recall, docs/REPORT.md). Tool calls are
# constrained by `tool_calls` above. Tool DECLARATIONS -- the name, description
# and schema a server sends at `tools/list` -- go straight into the model's
# context as trusted configuration, at session start, before any call, and stay
# there for the whole session. See docs/PLAN-DECLARATION-INTEGRITY.md.
#
# What this can and cannot tell you. It CANNOT tell you a server is malicious:
# a server that ships a poisoned description at install time is pinned exactly
# as faithfully as an honest one. It CAN tell you a server changed its mind
# after you trusted it. Those are different claims and only the second is made.
# Concealment is the one exception, because non-rendering characters are a
# property of a single declaration rather than of a change.
#
# The block looks like this:
#
#   tool_declarations:
#     # Actions per CONDITION, not per verdict: a declaration can be mutated
#     # AND concealed AND shadowing at once, and the most severe action wins.
#     default:
#       new:       allow      # trust on first use, recorded and logged
#       mutated:   escalate   # rug-pull: the pinned bytes changed
#       stale_pin: escalate   # pin written by another canonicaliser version
#       shadowed:  escalate   # another server already declares this name
#       concealed: escalate   # non-rendering characters in a field
#     on_pin_error: block     # unreadable pin store -> withhold that server
#     rules:
#       filesystem.read_file:
#         mutated: block      # this one tool is stable; a change is refused
#
# Every key above is its own default, so `tool_declarations: {}` gives exactly
# that. Actions: `allow` forwards, `escalate` forwards AND marks the row,
# `block` withholds the declaration so it never becomes a ToolParam.
#
# **Why the defaults escalate rather than block.** The mechanism has no
# false-negative rate -- a hash comparison either matches or it does not -- so
# there is nothing to calibrate, and `calibrated: false` above does NOT gate
# these blocks (same argument as `tool_calls`). But the operationally relevant
# number is how often a legitimate server changes a declaration, and nobody has
# published that base rate, including this project. plan.md 3.1 is the
# measurement. Until it exists, a control that might fire on every routine
# upstream release ships in observe-only mode, because a noisy control is one
# an operator switches off.
#
# **on_pin_error fails closed.** "The pin store is damaged" and "trust
# everything again" must not be the same outcome. Blocking is scoped to the one
# server whose pins could not be read; the session keeps running on whatever
# else verified cleanly, and the drop is logged.
#
# Pins live in `pins/<server>.json`, gitignored by default. They hold digests,
# field names and timestamps -- never a description or a schema (SEC-3) -- so
# committing them leaks nothing and turns tampering into a reviewable diff.
# SECURITY.md explains why that is worth more than signing the file would be.
