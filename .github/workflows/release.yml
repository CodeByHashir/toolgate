name: Release

# Publishes to PyPI when a version tag (v0.1.0a1, ...) is pushed, then
# installs the *published* package the way a user would and runs the
# scripted cross-server demo against it (design CEO-3b / C4). Announce a
# release only when `smoke` is green: tests run against the source tree, users
# run what was uploaded, and a missing file or dependency only shows up here.
#
# Publishing uses PyPI trusted publishing (OIDC). It needs a one-time setup on
# pypi.org: a trusted publisher for this repository, this workflow file
# (release.yml) and the `pypi` environment. No API token is stored here.
#
# The PyPI project is `toolgate-mcp`: `toolgate` on PyPI is an unrelated
# project. The command, the import package and the repository stay `toolgate`.

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      # The tag must name the version in pyproject.toml, or the smoke job
      # would install something other than what was just built.
      - name: Check the tag matches the package version
        id: version
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match pyproject version ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build sdist and wheel
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  smoke:
    needs: [build, publish]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      # The checkout is for the demo fixtures and tests only; toolgate itself
      # comes from PyPI below.
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      # PyPI can take a little while to serve a new upload.
      - name: Wait for the published version
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if uvx --refresh --from "toolgate-mcp==${VERSION}" toolgate --version; then
              exit 0
            fi
            sleep 20
          done
          echo "toolgate-mcp==${VERSION} never became installable from PyPI" >&2
          exit 1

      - name: Install the test environment (slim, for the fixtures only)
        run: uv sync --extra dev --frozen

      - name: Run the demo against the published package
        shell: bash
        env:
          TOOLGATE_REQUIRE_LIVE: "1"
        run: |
          export TOOLGATE_WRAP_COMMAND="[\"uvx\", \"--from\", \"toolgate-mcp==${VERSION}\", \"toolgate\"]"
          uv run --no-sync pytest -m live_servers tests/test_proxy_e2e.py -rA
